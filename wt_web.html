<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>War Thunder 载具工作台</title>
<style>
:root{--bg:#071018;--panel:#101d29;--panel2:#142534;--line:#20384b;--text:#e8f1f7;--muted:#86a0b4;--cyan:#47c2df;--green:#58d39b;--orange:#ffb86b;--red:#ff7d86}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -20%,#16415a 0,#071018 45%);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#14293a;color:var(--text);border-radius:8px;padding:9px 13px;transition:.18s}button:hover{border-color:var(--cyan);background:#18384c}button.primary{background:var(--cyan);border-color:var(--cyan);color:#041018;font-weight:700}button.danger{color:#ffd6d8;border-color:#713844}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1420px;margin:auto;padding:28px 30px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--cyan);letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:700}.title{font-size:30px;font-weight:700;letter-spacing:-.04em;margin:4px 0}.subtitle{color:var(--muted)}.status{display:flex;align-items:center;gap:9px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#0d1a25}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.grid{display:grid;grid-template-columns:280px minmax(420px,1fr) 360px;gap:16px}.panel{background:linear-gradient(145deg,#122230,#0e1923);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 14px 42px #0003}.panel h2{font-size:14px;margin:0 0 14px}.label{display:block;color:var(--muted);font-size:12px;margin:11px 0 5px}.input,.select{width:100%;background:#09141e;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 10px;outline:none}.input:focus,.select:focus{border-color:var(--cyan)}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.list{height:390px;overflow:auto;margin-top:9px;border:1px solid var(--line);border-radius:8px;background:#09141e}.item{padding:9px 11px;border-bottom:1px solid #173040;color:#c6d7e2;cursor:pointer}.item:hover,.item.active{background:#164157;color:white}.count{font-size:12px;color:var(--muted);margin-top:8px}.stack{display:grid;gap:12px}.section{padding-bottom:15px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0;padding-bottom:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.checks{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}.checks label{display:flex;gap:6px;align-items:center}.metric{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric div{padding:12px;background:#0b1721;border:1px solid var(--line);border-radius:9px}.metric strong{display:block;font-size:20px;color:var(--cyan)}.metric span{font-size:11px;color:var(--muted)}.log{height:548px;overflow:auto;background:#060d13;color:#b9d0dc;border-radius:9px;border:1px solid #183243;padding:12px;font:12px/1.65 Consolas,monospace;white-space:pre-wrap}.hint{color:var(--muted);font-size:12px}.footer{color:#597287;text-align:center;margin-top:18px;font-size:12px}@media(max-width:1100px){.grid{grid-template-columns:250px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){.shell{padding:18px}.top{display:block}.status{margin-top:14px;width:max-content}.grid{display:block}.panel{margin-bottom:14px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div><div class="eyebrow">Asset extraction control room</div><div class="title">载具提取工作台</div><div class="subtitle">扫描资源包、调用 DAE 与 Blender，生成可编辑的载具层级和材质。</div></div><div class="status"><i class="dot" id="dot"></i><span id="status">就绪</span></div></header>
<main class="grid">
<section class="panel"><h2>资源浏览器</h2><label class="label">载具类型</label><select class="select" id="category"><option>飞机</option><option>坦克</option><option>军舰</option><option>其它载具</option></select><label class="label">关键词筛选</label><input class="input" id="filter" placeholder="输入名称过滤"><div class="list" id="names"></div><div class="count" id="count">尚未扫描</div><div class="actions" style="margin-top:11px"><button id="scan">扫描 / 使用缓存</button><button id="refresh">强制刷新</button></div></section>
<section class="panel"><h2>提取配置</h2><div class="section"><label class="label">游戏 res 根目录</label><input class="input" id="res" placeholder="填写游戏 content/base/res 路径"><label class="label">Blender 程序</label><input class="input" id="blender" placeholder="填写 blender.exe 路径"><label class="label">输出目录</label><input class="input" id="out" value="output"></div><div class="section"><div class="row"><div><label class="label">载具资源名</label><input class="input" id="name" placeholder="从左侧列表选择或手动输入"></div><div style="max-width:100px"><label class="label">LOD</label><input class="input" id="lod" type="number" min="0" max="8" value="0"></div></div><div class="checks" style="margin-top:13px"><label><input id="effects" type="checkbox">保留特效面片</label><label><input id="temp" type="checkbox">保留调试临时文件</label></div></div><div class="section"><div class="actions"><button class="primary" id="extract">开始提取</button><button class="danger" id="stop">停止任务</button><button id="open">打开输出目录</button></div></div><div class="metric"><div><strong id="task">—</strong><span>当前任务</span></div><div><strong id="elapsed">—</strong><span>运行状态</span></div></div><div class="actions" style="margin-top:12px"><button id="diagnose">路径诊断</button><button id="clear">清理缓存</button></div><p class="hint">扫描首次读取 GRP，之后根据文件修改时间和大小使用缓存。</p></section>
<section class="panel"><h2>实时日志</h2><div class="log" id="log">等待任务开始…</div></section>
</main><div class="footer">本地运行 · 任务在当前电脑执行 · 中间文件按提取器设置自动清理</div>
</div>
<script>
const $=s=>document.querySelector(s);let task=0,names=[];const log=t=>{const box=$('#log');box.textContent+=`\n${t}`;box.scrollTop=box.scrollHeight};const body=()=>({category:$('#category').value,res:$('#res').value,blender:$('#blender').value,out:$('#out').value,name:$('#name').value,lod:$('#lod').value,keepEffects:$('#effects').checked,keepTemp:$('#temp').checked});async function api(path,data={},method='POST'){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:method==='GET'?undefined:JSON.stringify(data)});return r.json()}async function loadConfig(){const c=await api('/api/config',{},'GET');if(c.res)$('#res').value=c.res;if(c.blender)$('#blender').value=c.blender;if(c.out)$('#out').value=c.out}async function saveConfig(){const b=body();await api('/api/config',{res:b.res,blender:b.blender,out:b.out})}function render(){const q=$('#filter').value.toLowerCase();const shown=names.filter(n=>n.toLowerCase().includes(q));$('#names').innerHTML=shown.map(n=>`<div class="item" data-name="${n}">${n}</div>`).join('');$('#count').textContent=`${shown.length} / ${names.length} 个载具`;document.querySelectorAll('.item').forEach(e=>e.onclick=()=>{$('#name').value=e.dataset.name;document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));e.classList.add('active')})}async function runScan(refresh=false){await saveConfig();names=[];render();$('#log').textContent='开始扫描资源包…';const r=await api('/api/scan',{...body(),refresh});if(r.error)return log(r.error);task=r.task;$('#task').textContent=task;$('#status').textContent='扫描中';poll()}async function runExtract(){await saveConfig();const r=await api('/api/extract',body());if(r.error)return log(r.error);task=r.task;$('#task').textContent=task;$('#log').textContent=`开始提取 ${$('#name').value}…`;$('#status').textContent='提取中';poll()}async function poll(){if(!task)return;const r=await fetch(`/api/events?task=${task}`).then(x=>x.json());for(const e of r.events){if(e.line){log(e.line);if(e.kind==='scan'&&e.line.startsWith('__WT_NAME__')){names.push(e.line.slice(11));render()}}if(e.done){$('#status').textContent=e.code===0?'完成':'失败';$('#dot').style.background=e.code===0?'var(--green)':'var(--red)';}}if(r.snapshot.status==='running'||r.snapshot.status==='stopping'){setTimeout(poll,250)}else{$('#elapsed').textContent=r.snapshot.status}}$('#filter').oninput=render;$('#scan').onclick=()=>runScan(false);$('#refresh').onclick=()=>runScan(true);$('#extract').onclick=runExtract;$('#stop').onclick=async()=>{await api('/api/stop');$('#status').textContent='停止中'};$('#open').onclick=async()=>{const r=await api('/api/open-output',{out:$('#out').value});if(r.error)log(r.error)};$('#diagnose').onclick=async()=>{const r=await api('/api/diagnose',body());$('#log').textContent=JSON.stringify(r,null,2)};$('#clear').onclick=async()=>{const r=await api('/api/clear-cache');log(`已清理 ${r.removed||0} 个扫描缓存文件`)};$('#category').onchange=()=>{names=[];render()};loadConfig();
</script>
</body>
</html>
